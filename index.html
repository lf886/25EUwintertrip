<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>菲&伊的冬季旅記 (Final Polish)</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
    <meta name="theme-color" content="#B08968">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="冬季旅記">

    <!-- Google Fonts: Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'morandi-bg': '#FDFCF8',
                        'morandi-card': '#FFFFFF',
                        'morandi-primary': '#B08968',  /* 棕色 */
                        'morandi-accent': '#A65D57',   /* 酒紅色 */
                        'morandi-dark': '#4A4A4A',
                        'morandi-secondary': '#7A7A7A',
                        'morandi-green': '#7FA99B', 
                        'morandi-orange': '#D4A88C',
                        'morandi-blue': '#7FB5D6', /* 亮藍色 */
                        'morandi-indigo': '#6A8CAF', /* 靛藍色 (Felix) */
                    },
                    fontFamily: {
                        sans: ['Open Sans', 'Noto Sans TC', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'float': '0 10px 30px -5px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Open Sans', 'Noto Sans TC', 'sans-serif'; background-color: var(--morandi-bg); color: #4A4A4A; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Menu Active State */
        .menu-active { background-color: #FDFCF8; color: #B08968; font-weight: 700; border-left: 4px solid #B08968; }
        
        /* New Tab Styles */
        .tab-btn { position: relative; color: #9CA3AF; font-weight: 500; transition: all 0.3s; }
        .tab-btn::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0%; height: 2px; background-color: #B08968; transition: width 0.3s; }
        
        .active-subtab { color: #4A4A4A; font-weight: 700; }
        .active-subtab::after { width: 100%; }
        
        .dragging { opacity: 0.5; transform: scale(0.98); }
        .nav-btn:active { transform: scale(0.9); }
        
        .image-gradient-mask {
            background: linear-gradient(to top, white 0%, rgba(255,255,255,0.8) 30%, transparent 100%);
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }

        /* Menu Animation */
        #nav-menu { transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out; transform-origin: top right; }
        .menu-hidden { transform: scale(0.95); opacity: 0; pointer-events: none; }
        .menu-visible { transform: scale(1); opacity: 1; pointer-events: auto; }
        
        /* Readonly Input Style */
        input:read-only { background-color: #F3F4F6; color: #6B7280; cursor: not-allowed; }
    </style>
</head>
<body class="bg-morandi-bg min-h-screen">

    <!-- 頂部導航與漢堡選單 -->
    <header class="sticky top-0 z-40 bg-morandi-bg/95 backdrop-blur-sm p-4 shadow-sm border-b border-morandi-primary/20">
        <div class="flex justify-between items-center relative">
            <!-- Clickable Title to go Home -->
            <div onclick="switchTab('itinerary')" class="cursor-pointer flex items-center gap-2">
                <!-- Tiny icon in header as well -->
                <img src="icon.png?v=3" class="w-8 h-8 rounded-lg shadow-sm" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-xl font-bold text-morandi-dark tracking-wide">菲&伊的冬季旅記 🎄</h1>
                    <p class="text-[10px] text-morandi-accent font-medium leading-none">2025/12/21 - 2026/01/04</p>
                </div>
            </div>
            
            <!-- 漢堡按鈕 -->
            <button onclick="toggleMenu()" class="p-2 rounded-full hover:bg-gray-100 transition focus:outline-none z-50 relative">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-morandi-dark" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <!-- 下拉選單 -->
            <div id="nav-menu" class="absolute top-14 right-0 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 menu-hidden overflow-hidden flex flex-col z-40">
                <div class="py-2">
                    <button id="menu-itinerary" onclick="switchTab('itinerary')" class="w-full text-left px-6 py-4 text-morandi-dark hover:bg-gray-50 transition flex items-center gap-3 menu-active">
                        <span>📅</span> 行程資訊
                    </button>
                    <button id="menu-budget" onclick="switchTab('budget')" class="w-full text-left px-6 py-4 text-morandi-dark hover:bg-gray-50 transition flex items-center gap-3 border-l-4 border-transparent">
                        <span>💰</span> 記帳管理
                    </button>
                    <button id="menu-todo" onclick="switchTab('todo')" class="w-full text-left px-6 py-4 text-morandi-dark hover:bg-gray-50 transition flex items-center gap-3 border-l-4 border-transparent">
                        <span>📝</span> 清單管理
                    </button>
                </div>
                
                <!-- 連線狀態 (移至選單底部) -->
                <div class="border-t border-gray-100 p-4 bg-gray-50">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-400">雲端狀態</span>
                        <div id="connection-status" class="text-xs px-2 py-1 rounded-full bg-yellow-100 text-yellow-600 animate-pulse font-bold">
                            啟動中...
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 遮罩 (點擊外部關閉) -->
            <div id="menu-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-transparent z-30 hidden"></div>
        </div>
    </header>

    <main id="app-container" class="pb-24">

        <!-- 行程內容區 -->
        <div id="itinerary-view" class="pt-0 space-y-4"> 
            <!-- 日期選擇器 -->
            <div class="relative bg-morandi-bg z-10 pt-4 pb-2">
                <div class="max-w-xl mx-auto px-4 flex items-center">
                    <button onclick="scrollNav(-1)" class="p-2 text-morandi-primary hover:bg-morandi-primary/10 rounded-full flex-shrink-0 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                    </button>
                    <div id="day-navigation" class="flex overflow-x-auto px-2 space-x-3 no-scrollbar scroll-smooth w-full"></div>
                    <button onclick="scrollNav(1)" class="p-2 text-morandi-primary hover:bg-morandi-primary/10 rounded-full flex-shrink-0 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </button>
                </div>
            </div>
            
            <!-- 城市圖片 Header (Full Width Banner) -->
            <div class="w-full">
                <div id="city-header-container" onclick="openCityModal(currentDayIndex)" class="w-full relative h-56 bg-gray-100 group cursor-pointer overflow-hidden">
                    <div id="header-img-wrapper" class="w-full h-full relative">
                        <!-- Image populated by JS -->
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent pointer-events-none">
                        <!-- Modified Layout for Alignment -->
                         <div class="max-w-xl mx-auto px-4 w-full h-full flex flex-col justify-end pb-6">
                            <div class="text-white">
                                <h2 id="header-city" class="text-2xl font-bold drop-shadow-md tracking-wide font-sans"></h2>
                                <p id="header-weather" class="text-sm opacity-90 font-medium mt-1"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 卡片列表 -->
            <div class="max-w-xl mx-auto px-4">
                <div id="itinerary-cards" class="space-y-5 pb-10 pt-2">
                    <div class="text-center text-morandi-secondary/60 py-10" id="loading-indicator">正在讀取雲端資料...</div>
                </div>
            </div>
        </div>

        <!-- 記帳內容區 -->
        <div id="budget-view" class="hidden pt-2 relative min-h-[80vh]">
             <div class="max-w-xl mx-auto px-4">
                <!-- 子分頁 Tab 導航 -->
                <div class="flex space-x-6 mb-6 sticky top-[76px] z-20 bg-morandi-bg pt-3 pb-2 border-b border-gray-100">
                    <button id="subtab-history" onclick="switchBudgetSubTab('history')" class="tab-btn active-subtab pb-2 flex items-center gap-2">
                        花費紀錄
                    </button>
                    <button id="subtab-balance" onclick="switchBudgetSubTab('balance')" class="tab-btn pb-2 flex items-center gap-2">
                        查看結算
                    </button>
                </div>

                <!-- 歷史資料區塊 -->
                <div id="history-view">
                    <div class="flex justify-end items-center mb-4 space-x-3">
                        <div id="filter-status-bar" class="hidden flex items-center bg-gray-100 rounded-xl px-3 py-2 text-xs text-gray-500 shadow-sm transition-all">
                            <span id="filter-status-text" class="mr-2 font-medium tracking-wide"></span>
                            <button onclick="clearFilter()" class="flex items-center justify-center w-5 h-5 rounded-full bg-gray-200 text-gray-400 hover:bg-gray-300 hover:text-white transition text-[10px] font-bold">✕</button>
                        </div>
                        <button onclick="openFilterModal()" class="p-2 bg-white border border-gray-200 rounded-lg text-morandi-primary hover:bg-morandi-primary hover:text-white transition shadow-sm relative group">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <span id="filter-active-dot" class="hidden absolute -top-1 -right-1 w-3 h-3 bg-morandi-accent rounded-full border-2 border-morandi-bg"></span>
                        </button>
                    </div>
                    <div class="space-y-3 pb-24" id="expense-list"></div>
                </div>

                <!-- 結算區塊 -->
                <div id="settlement-view" class="hidden">
                    <div class="bg-white rounded-2xl shadow-sm border border-morandi-primary/20 overflow-hidden">
                        <div class="p-4 bg-morandi-bg border-b border-gray-100 font-bold text-morandi-dark">
                            結算結果 (Balance)
                        </div>
                        <div id="balance-content" class="p-4 bg-white">
                            <div id="balance-list" class="space-y-3"></div>
                        </div>
                    </div>
                </div>

                <!-- FAB: Add Expense -->
                <button onclick="openAddExpenseModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-morandi-primary text-white rounded-full shadow-lg hover:bg-morandi-accent hover:scale-110 active:scale-95 transition-all flex items-center justify-center z-30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </button>
            </div>
        </div>

        <!-- 待辦清單內容區 -->
        <div id="todo-view" class="hidden pt-2 relative min-h-[80vh]">
             <div class="max-w-xl mx-auto px-4">
                <!-- 子分頁 Tab 導航 -->
                <div class="flex space-x-6 mb-6 sticky top-[76px] z-20 bg-morandi-bg pt-3 pb-2 border-b border-gray-100">
                    <button id="subtab-todo-list" onclick="switchTodoSubTab('todo')" class="tab-btn active-subtab pb-2 flex items-center gap-2">
                        待辦事項
                    </button>
                    <button id="subtab-shopping-list" onclick="switchTodoSubTab('shopping')" class="tab-btn pb-2 flex items-center gap-2">
                        購物清單
                    </button>
                    <button id="subtab-must-eat-list" onclick="switchTodoSubTab('must_eat')" class="tab-btn pb-2 flex items-center gap-2">
                        想吃清單
                    </button>
                </div>

                <!-- 清單顯示區塊 -->
                <div id="todo-list-view">
                    <div class="flex justify-end items-center mb-4 space-x-3">
                        <select id="todo-filter" onchange="renderTodoList()" class="p-2 bg-white border border-gray-200 rounded-lg text-xs font-bold text-morandi-secondary focus:outline-none">
                            <option value="all">顯示全部</option>
                            <option value="incomplete">未完成</option>
                            <option value="completed">已完成</option>
                        </select>
                    </div>
                    <div class="space-y-3 pb-24" id="todo-list-container"></div>
                </div>

                <!-- FAB: Add Todo -->
                <button onclick="openAddTodoModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-morandi-primary text-white rounded-full shadow-lg hover:bg-morandi-accent hover:scale-110 active:scale-95 transition-all flex items-center justify-center z-30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </button>
            </div>
        </div>

    </main>

    <!-- 加入行程確認 Modal -->
    <div id="add-to-itinerary-modal" class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-50 flex justify-center items-center hidden transition-opacity duration-300">
        <div class="bg-white w-full sm:w-96 rounded-3xl shadow-2xl p-6 animate-slide-up relative mx-4">
            <h3 class="text-xl font-bold text-morandi-dark mb-4 text-center">✨ 完成美食項目</h3>
            
            <div id="step-1-confirm">
                <p class="text-center text-gray-500 mb-6 font-medium">是否要將此餐廳同步加入行程表？</p>
                <div class="flex space-x-3">
                    <button onclick="confirmAddToItinerary('cancel')" class="flex-1 py-3 text-sm font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-xl transition">取消</button>
                    <button onclick="confirmAddToItinerary(false)" class="flex-1 py-3 text-sm font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-xl transition">否，僅完成</button>
                    <button onclick="confirmAddToItinerary(true)" class="flex-1 py-3 text-sm font-bold text-white bg-morandi-primary shadow-lg hover:opacity-90 rounded-xl transition">是，加入行程</button>
                </div>
            </div>

            <div id="step-2-form" class="hidden space-y-4">
                <input type="hidden" id="sync-todo-id">
                <input type="hidden" id="sync-todo-image">
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">餐廳名稱</label>
                    <input type="text" id="sync-name" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-none font-bold text-morandi-dark">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">選擇日期</label>
                        <input type="date" id="sync-date" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">選擇時間</label>
                        <input type="time" id="sync-time" value="12:00" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">類型</label>
                        <select id="sync-type" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-none focus:ring-2 focus:ring-morandi-primary/30">
                            <option value="dining">DINING</option>
                            <option value="cafe">CAFE</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">必吃料理</label>
                        <input type="text" id="sync-must-eat" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-none">
                    </div>
                </div>
                
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">備註</label>
                    <textarea id="sync-todo-note" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-none h-20" placeholder="備註會同步至行程卡片"></textarea>
                </div>

                <div class="flex space-x-3 pt-2">
                    <button onclick="document.getElementById('add-to-itinerary-modal').classList.add('hidden')" class="w-1/3 py-3 text-sm font-bold text-gray-400 hover:bg-gray-100 rounded-xl transition">取消</button>
                    <button onclick="submitAddToItinerary()" class="flex-1 py-3 text-sm font-bold text-white bg-morandi-primary shadow-lg hover:opacity-90 rounded-xl transition">確認加入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 行程/城市編輯 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-50 flex justify-center items-end sm:items-center hidden transition-opacity duration-300">
        <div class="bg-white w-full sm:w-auto sm:max-w-lg h-[95vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-slide-up sm:animate-none relative">
            <div class="absolute top-4 right-4 z-50">
                <button onclick="closeModal()" class="p-2 bg-black/20 hover:bg-black/40 backdrop-blur-md rounded-full text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="modal-content-area" class="overflow-y-auto flex-1 bg-white"></div>
            <!-- Updated Footer Buttons for Mobile Optimization -->
            <div class="p-3 border-t border-gray-100 bg-white flex justify-between space-x-2 shrink-0 z-20 overflow-x-auto">
                <!-- Mobile Reorder Buttons (SVG Icons) -->
                <div class="flex space-x-2 mr-auto shrink-0" id="mobile-reorder-controls">
                    <button onclick="moveCard(-1)" class="p-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-gray-600 transition flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
                    </button>
                    <button onclick="moveCard(1)" class="p-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-gray-600 transition flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" /></svg>
                    </button>
                </div>

                <button id="delete-card-btn" onclick="deleteCurrentCard()" class="px-3 py-2 text-xs font-bold text-red-500 bg-red-50 hover:bg-red-100 rounded-xl transition flex items-center gap-1 hidden shrink-0 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    刪除
                </button>
                <div class="flex space-x-2 ml-auto shrink-0">
                    <button onclick="closeModal()" class="px-3 py-2 text-xs font-bold text-gray-500 hover:bg-gray-100 rounded-xl transition whitespace-nowrap">取消</button>
                    <button id="save-btn" onclick="saveCardEdit()" class="px-4 py-2 text-xs font-bold text-white bg-morandi-primary rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition whitespace-nowrap">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 記帳編輯 Modal -->
    <div id="expense-modal" class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-50 flex justify-center items-end sm:items-center hidden transition-opacity duration-300">
        <div class="bg-white w-full sm:w-auto sm:max-w-lg h-[90vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-slide-up sm:animate-none relative">
            <div class="absolute top-4 right-4 z-50">
                <button onclick="closeExpenseModal()" class="p-2 bg-black/20 hover:bg-black/40 backdrop-blur-md rounded-full text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="p-6 pt-12 overflow-y-auto flex-1 bg-white">
                <h3 id="form-title" class="text-xl font-bold mb-6 text-morandi-dark pl-2 border-l-4 border-morandi-primary">新增支出</h3>
                <form id="accounting-form" class="space-y-4">
                    <!-- Accounting Form Fields -->
                    <div class="grid grid-cols-3 gap-3">
                        <div class="col-span-2">
                            <label class="text-xs text-gray-400 mb-1 block">日期</label>
                            <input type="date" id="expense-date" required class="w-full p-3 bg-gray-50 rounded-xl text-sm border-none focus:ring-2 focus:ring-morandi-primary/30">
                        </div>
                        <div class="col-span-1">
                            <label class="text-xs text-gray-400 mb-1 block">幣別</label>
                            <select id="expense-currency" class="w-full p-3 bg-gray-50 rounded-xl text-sm border-none focus:ring-2 focus:ring-morandi-primary/30">
                                <option value="TWD">TWD</option>

        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCT49HGzmllHYHfZlxssFEjhk-WqH17XPc",

          messagingSenderId: "1086944279222",
          appId: "1:1086944279222:web:ca05a82804160241a40417"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase Init Error:", e);
            document.getElementById('connection-status').textContent = '初始化錯誤';
        }
        
        const APP_ID = 'eutrip-v2';
        const ITINERARY_DOC_REF = doc(db, 'artifacts', APP_ID, 'public_data', 'itinerary');
        const ACCOUNTING_DOC_REF = doc(db, 'artifacts', APP_ID, 'public_data', 'accounting');
        const TODO_DOC_REF = doc(db, 'artifacts', APP_ID, 'public_data', 'todo');

        let unsubscribeItinerary = null;
        let unsubscribeAccounting = null;
        let unsubscribeTodo = null;

        const CITY_INFO_MAP = {
            'Wien': { country: 'Austria', cityCode: '2761369', city: 'Vienna' },
            'Vienna': { country: 'Austria', cityCode: '2761369' },
            'Prague': { country: 'Czechia', cityCode: '3067696' },
            'Nürnberg': { country: 'Germany', cityCode: '2861650' },
            'Strasbourg': { country: 'France', cityCode: '2973783' },
            'Paris': { country: 'France', cityCode: '3017382' }
        };

        async function initApp() {
            const statusEl = document.getElementById('connection-status');
            const timeoutId = setTimeout(() => {
                if (statusEl.textContent.includes('啟動中') || statusEl.textContent.includes('連接')) {
                    updateStatus('連線逾時，請檢查網路或 Console', true);
                }
            }, 8000);

            try {
                updateStatus('正在連接 Firebase...');
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    clearTimeout(timeoutId);
                    if (user) {
                        updateStatus('已連線至雲端');
                        setupListeners();
                    } else {
                        updateStatus('尚未連線');
                    }
                });
            } catch (error) {
                clearTimeout(timeoutId);
                console.error("Firebase Auth Error:", error);
                updateStatus('連線失敗', true);
            }
        }

        function updateStatus(msg, isError = false) {
            const el = document.getElementById('connection-status');
            el.textContent = msg;
            el.className = isError ? 'text-xs px-2 py-1 rounded-full bg-red-100 text-red-600 font-bold' :
                                   (msg.includes('已連線') ? 'text-xs px-2 py-1 rounded-full bg-green-100 text-green-600' : 
                                   'text-xs px-2 py-1 rounded-full bg-yellow-100 text-yellow-600 animate-pulse');
        }

        function setupListeners() {
            unsubscribeItinerary = onSnapshot(ITINERARY_DOC_REF, (docSnap) => {
                if (docSnap.exists() && docSnap.data().data) {
                    window.appData = docSnap.data().data;
                    let needsUpdate = false;
                    window.appData.days.forEach(day => {
                        const mapInfo = CITY_INFO_MAP[day.city] || CITY_INFO_MAP['Vienna'];
                        if (mapInfo) {
                            if (!day.country) { day.country = mapInfo.country; needsUpdate = true; }
                            if (!day.cityCode) { day.cityCode = mapInfo.cityCode; needsUpdate = true; }
                            if (day.city === 'Wien') { day.city = 'Vienna'; needsUpdate = true; }
                        }
                    });
                    if(needsUpdate) { saveDataToFirestore(); }
                    renderAll();
                } else {
                    window.appData = initialItineraryData;
                    saveDataToFirestore().then(() => updateStatus('已連線至雲端'));
                    renderAll(); 
                }
            }, (error) => console.error("Firestore Error (Itinerary):", error));

            unsubscribeAccounting = onSnapshot(ACCOUNTING_DOC_REF, (docSnap) => {
                if (docSnap.exists() && docSnap.data().data) {
                    window.accountingData = docSnap.data().data;
                } else {
                    window.accountingData = { entries: [] };
                    saveAccountingToFirestore();
                }
                renderAccountingList(); 
            }, (error) => console.error("Firestore Error (Accounting):", error));

            unsubscribeTodo = onSnapshot(TODO_DOC_REF, (docSnap) => {
                if (docSnap.exists() && docSnap.data().data) {
                    window.todoData = docSnap.data().data;
                } else {
                    window.todoData = { items: [] };
                    saveTodoToFirestore();
                }
                renderTodoList(); 
            }, (error) => console.error("Firestore Error (Todo):", error));
        }

        window.saveDataToFirestore = async function() {
            try { await setDoc(ITINERARY_DOC_REF, { data: window.appData }, { merge: true }); } 
            catch(e) { 
                console.error("Save Error:", e);
                alert("儲存失敗：資料可能過大 (超過1MB)，請嘗試刪除一些舊照片或使用較小的圖片。");
            }
        }

        window.saveAccountingToFirestore = async function() {
            try { await setDoc(ACCOUNTING_DOC_REF, { data: window.accountingData }, { merge: true }); } 
            catch(e) { console.error("Save Accounting Error:", e); }
        }

        window.saveTodoToFirestore = async function() {
            try { await setDoc(TODO_DOC_REF, { data: window.todoData }, { merge: true }); } 
            catch(e) { 
                console.error("Save Todo Error:", e);
                alert("儲存清單失敗：資料可能過大，請嘗試減少圖片數量。");
            }
        }

        initApp();
    </script>

                 if (cardIndex === -1) {
                    window.appData.days[dayIndex].cards.push(newData);
                    window.appData.days[dayIndex].cards.sort((a,b) => a.time.localeCompare(b.time));
                } else if (window.appData.days[dayIndex].cards[cardIndex]) {
                    Object.assign(window.appData.days[dayIndex].cards[cardIndex], newData);

            if (cardIndex === -1 || cardIndex === 'header') return;
            const cards = window.appData.days[dayIndex].cards;
            const newIndex = cardIndex + direction;
            if (newIndex >= 0 && newIndex < cards.length) {
                const temp = cards[cardIndex];
                cards[cardIndex] = cards[newIndex];
                cards[newIndex] = temp;
                editingCardRef.cardIndex = newIndex;

            renderDayItinerary(dayIndex);

            const day = window.appData.days[currentDayIndex];
            const container = document.getElementById('header-img-wrapper');
            const cityText = document.getElementById('header-city');
            const weatherText = document.getElementById('header-weather');
            if (day.image) {
                container.innerHTML = `<img src="${day.image}" class="w-full h-full object-cover transition-opacity duration-700">`;
            } else {
                container.innerHTML = `<div class="w-full h-full bg-gray-200 flex flex-col items-center justify-center text-gray-400"><svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg><span class="text-sm font-bold">點擊上傳城市封面</span></div>`;
            }
            cityText.textContent = `${cityZh} ${day.city || ''}`;

        function getTagHTML(text) {
            if (!text || text.includes('無需')) return '';
            let className = 'bg-gray-100 text-gray-500';
            if (text.includes('已')) className = 'bg-morandi-green/10 text-morandi-green';
            if (text.includes('需') || text.includes('未')) className = 'bg-morandi-orange/10 text-morandi-orange';
            return `<span class="text-[10px] px-2 py-1 rounded-md font-bold ${className}">${text}</span>`;
        }

        function renderCard(card, dIdx, cIdx) {
            let typeLabel = '';
            let typeColorClass = '';
            let typeBgClass = '';
            let borderColorClass = ''; 
            let shadowColorClass = ''; 
            let bookingBtn = '';

            switch(card.type) {
                case 'sightseeing': typeLabel = 'SCENERY'; typeColorClass = 'text-morandi-green'; typeBgClass = 'bg-morandi-green/10'; borderColorClass = 'border-morandi-green'; shadowColorClass = 'shadow-morandi-green/10'; break;
                case 'dining': typeLabel = 'DINING'; typeColorClass = 'text-morandi-blue'; typeBgClass = 'bg-morandi-blue/10'; borderColorClass = 'border-morandi-blue'; shadowColorClass = 'shadow-morandi-blue/10'; break;
                case 'cafe': typeLabel = 'CAFE'; typeColorClass = 'text-morandi-orange'; typeBgClass = 'bg-morandi-orange/10'; borderColorClass = 'border-morandi-orange'; shadowColorClass = 'shadow-morandi-orange/10'; break;
                case 'accommodation': typeLabel = 'HOTEL'; typeColorClass = 'text-morandi-accent'; typeBgClass = 'bg-morandi-accent/10'; borderColorClass = 'border-morandi-accent'; shadowColorClass = 'shadow-morandi-accent/10'; break;
                case 'transport': typeLabel = 'TRANSPORT'; typeColorClass = 'text-gray-500'; typeBgClass = 'bg-gray-100'; borderColorClass = 'border-gray-300'; shadowColorClass = 'shadow-gray-200/10'; break;
                default: typeLabel = 'ACTIVITY'; typeColorClass = 'text-gray-500'; typeBgClass = 'bg-gray-100'; borderColorClass = 'border-gray-200'; shadowColorClass = 'shadow-gray-200/10';
            }

            const showLink = (status, link) => status && status.includes('已') && link;
            let linkUrl = '';
            
            if (card.type === 'sightseeing' && showLink(card.data.ticket_status, card.data.ticket_link)) linkUrl = card.data.ticket_link;
            else if ((card.type === 'dining' || card.type === 'cafe') && showLink(card.data.reservation, card.data.link)) linkUrl = card.data.link;
            else if (card.type === 'accommodation' && showLink(card.data.status, card.data.booking_link)) linkUrl = card.data.booking_link;

            if (linkUrl) {
                bookingBtn = `<a href="${linkUrl}" target="_blank" onclick="event.stopPropagation();" class="text-xs font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded-md hover:bg-blue-100 transition">🎫 查看訂單</a>`;
            }

            let statusTag = '';
            if (card.type === 'sightseeing') statusTag = getTagHTML(card.data.ticket_status);
            if (card.type === 'dining' || card.type === 'cafe') statusTag = getTagHTML(card.data.reservation);
            if (card.type === 'accommodation') statusTag = getTagHTML(card.data.status);

            let imageSection = '';
            if (card.data.image) {
                imageSection = `<div class="h-36 w-full relative overflow-hidden bg-gray-100 border-b border-gray-100 shrink-0"><img src="${card.data.image}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 block" loading="lazy" draggable="false"></div>`;
            }

            if (card.type === 'transport') {
                let vehicleIcon = '';
                if (card.data.vehicle === '火車') { vehicleIcon = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" /><path d="M3 11h18" /><path d="M8 15h.01" /><path d="M16 15h.01" /><path d="M6 19l-2 3" /><path d="M18 19l2 3" /></svg>'; }
                else if (card.data.vehicle === '客運' || card.data.vehicle === 'Bus') { vehicleIcon = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="10" rx="3" /><path d="M2 12h20" /><path d="M9 6v6" /><path d="M15 6v6" /><path d="M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" /><path d="M17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" /></svg>'; }
                else if (card.data.vehicle === '飛機' || card.data.vehicle === 'Plane') { vehicleIcon = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" transform="rotate(90, 12, 12)"/></svg>'; } 
                else if (card.data.vehicle === '地鐵' || card.data.vehicle === 'Subway') { vehicleIcon = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2" /><path d="M4 11h16" /><path d="M8 15h.01" /><path d="M16 15h.01" /><path d="M8 2h8" /><path d="M12 2v3" /></svg>'; }
                else { vehicleIcon = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>'; }

                let transportBookingBtn = '';
                if (card.data.booking_link) {
                    transportBookingBtn = `
                        <a href="${card.data.booking_link}" target="_blank" onclick="event.stopPropagation();" 
                           class="mt-2 text-[10px] font-bold text-blue-500 bg-blue-50/50 hover:bg-blue-100 border border-blue-100 px-1 py-0.5 rounded-md transition shadow-sm flex items-center justify-center gap-0.5 whitespace-nowrap w-full max-w-[60px]">
                            查看訂單
                        </a>`;
                }

                return `
                    <div draggable="true" data-index="${cIdx}" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" onclick="openEditModal(${dIdx}, ${cIdx})" class="group bg-white rounded-2xl shadow-md ${shadowColorClass} transition-all duration-300 overflow-hidden relative cursor-pointer transform hover:-translate-y-1 border-l-4 ${borderColorClass}">
                        <div class="p-6 py-8 flex items-center justify-between text-morandi-dark">
                            <div class="flex flex-col items-center w-1/3 text-center px-1">
                                <div onclick="event.stopPropagation(); window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('${(card.data.origin || '').replace(/'/g, "\\'")}' + ' ' + window.appData.days[${dIdx}].city_zh), '_blank')" class="text-lg font-black text-gray-800 leading-tight mb-1 w-full break-words whitespace-normal hover:text-morandi-primary transition-colors cursor-pointer">${card.data.origin || '出發地'}</div>
                                <div class="text-sm font-bold text-gray-400">${card.time}</div>
                            </div>
                            <div class="flex flex-col items-center w-1/3 px-1">
                                <div class="text-morandi-primary mb-1 opacity-80 scale-125">${vehicleIcon}</div>
                                <div class="text-gray-300 font-light text-2xl leading-none" style="margin-top: -5px;">⟶</div>
                                ${transportBookingBtn}
                            </div>
                            <div class="flex flex-col items-center w-1/3 text-center px-1">
                                <div onclick="event.stopPropagation(); window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('${(card.data.destination || '').replace(/'/g, "\\'")}' + ' ' + window.appData.days[${dIdx}].city_zh), '_blank')" class="text-lg font-black text-gray-800 leading-tight mb-1 w-full break-words whitespace-normal hover:text-morandi-primary transition-colors cursor-pointer">${card.data.destination || '目的地'}</div>
                                <div class="text-sm font-bold text-gray-400">${card.data.arrival_time || '--:--'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            let noteContent = '';
            if (card.data.story) noteContent = `<p class="mt-2 text-sm text-gray-500 leading-relaxed">${card.data.story}</p>`;
            if (card.data.must_eat) noteContent = `<p class="text-xs text-gray-500 bg-gray-50 p-2 rounded-lg inline-block mb-2">🍴 必吃：${card.data.must_eat}</p>` + noteContent;

            return `
                <div draggable="true" data-index="${cIdx}" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" onclick="openEditModal(${dIdx}, ${cIdx})" class="group bg-white rounded-2xl shadow-md ${shadowColorClass} transition-all duration-300 overflow-hidden relative cursor-pointer transform hover:-translate-y-1 border-l-4 ${borderColorClass}">
                    ${imageSection}
                    <div class="flex flex-row items-stretch min-h-[100px]">
                        <div class="w-20 shrink-0 flex flex-col items-center justify-center border-r border-gray-100 bg-gray-50/50 py-4">
                             <span class="text-xl font-black text-gray-800 tracking-tight">${card.time}</span>
                        </div>
                        <div class="flex-1 p-5 py-4 flex flex-col justify-center">
                            <div class="flex flex-col mb-1">
                                 <h3 onclick="event.stopPropagation(); window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('${card.name.replace(/'/g, "\\'")}' + ' ' + window.appData.days[${dIdx}].city_zh), '_blank')" class="text-lg font-bold text-morandi-dark leading-snug mb-2 hover:text-morandi-primary transition-colors cursor-pointer">${card.name}</h3>
                            </div>
                            <div class="flex flex-wrap gap-2 mb-2 items-center">
                                <span class="${typeColorClass} ${typeBgClass} px-2 py-1 rounded-md text-[10px] font-bold tracking-wider uppercase">${typeLabel}</span>
                                ${statusTag}
                                ${bookingBtn}
                            </div>
                            ${noteContent}
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleDragStart = function(e) {
            dragSrcEl = e.currentTarget;
            dragSrcIndex = parseInt(dragSrcEl.getAttribute('data-index'));
            e.dataTransfer.effectAllowed = 'move';
            e.currentTarget.classList.add('dragging');
        }

        window.handleDragOver = function(e) { if (e.preventDefault) e.preventDefault(); return false; }

        window.handleDrop = function(e) {
            if (e.stopPropagation) e.stopPropagation();
            const target = e.currentTarget.closest('[draggable]');
            if (dragSrcEl !== target) {
                const targetIndex = parseInt(target.getAttribute('data-index'));
                window.reorderCards(currentDayIndex, dragSrcIndex, targetIndex);
            }
            document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
            return false;
        }

        function renderDayItinerary(dayIndex) {
            const container = document.getElementById('itinerary-cards');
            if(!window.appData.days || !window.appData.days[dayIndex]) {
                container.innerHTML = `<div class="text-center py-10">資料讀取中...</div>`;
                return;
            }
            const day = window.appData.days[dayIndex];
            renderDayHeader(day.city, day.city_zh);
            container.innerHTML = (!day.cards || day.cards.length === 0) ? `<div class="text-center py-12 text-gray-300">本日尚無行程，點擊下方按鈕新增</div>` : day.cards.map((c, i) => renderCard(c, dayIndex, i)).join('');
            container.innerHTML += `<button onclick="openAddCardModal(${dayIndex})" class="w-full py-4 mt-4 border-2 border-dashed border-morandi-primary/20 rounded-3xl text-morandi-primary font-bold hover:bg-morandi-primary/5 transition flex items-center justify-center gap-2 group"><span class="bg-morandi-primary text-white rounded-full w-6 h-6 flex items-center justify-center text-sm group-hover:scale-100 transition">+</span> <span>Add New Activity</span></button>`;
        }

        function changeDay(idx) { currentDayIndex = idx; renderDayNavigation(); renderDayItinerary(idx); }

        window.openCityModal = function(dayIndex) {
            editingCardRef = { dayIndex: dayIndex, cardIndex: 'header' };
            const day = window.appData.days[dayIndex];
            const dummyCityCard = { type: 'city_header', data: { image: day.image || '', cityCode: day.cityCode || '', city_zh: day.city_zh || '', city: day.city || '', country: day.country || '', id: day.id, date: day.date } };
            document.getElementById('delete-card-btn').classList.add('hidden');
            document.getElementById('mobile-reorder-controls').classList.add('hidden');
            renderModalContent(dummyCityCard, false);
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function openAddCardModal(dIdx) {
            editingCardRef = { dayIndex: dIdx, cardIndex: -1 };
            document.getElementById('delete-card-btn').classList.add('hidden');
            document.getElementById('mobile-reorder-controls').classList.add('hidden');
            renderModalContent({ type: 'sightseeing', time: '10:00', name: '', data: { ticket_status: '需提前購票' } }, true);
            document.getElementById('edit-modal').classList.remove('hidden');
        }
        function openEditModal(dIdx, cIdx) {
            editingCardRef = { dayIndex: dIdx, cardIndex: cIdx };
            document.getElementById('delete-card-btn').classList.remove('hidden');
            document.getElementById('mobile-reorder-controls').classList.remove('hidden');
            renderModalContent(window.appData.days[dIdx].cards[cIdx], false);
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        window.removeImage = function(context) {
            if (confirm('確定要移除這張圖片嗎？')) {
                if (context === 'card') {
                    document.getElementById('hidden-image-data').value = '';
                    const container = document.getElementById('image-upload-area');
                    container.innerHTML = `<div class="w-full h-full bg-gray-50 flex flex-col items-center justify-center text-gray-400 group-hover:bg-gray-100 transition cursor-pointer" onclick="document.getElementById('file-upload').click()"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg><span class="text-xs font-bold">點擊上傳封面</span></div>`;
                    const section = document.getElementById('image-section-container');
                    if(section) section.classList.replace('h-56', 'h-16');
                } else if (context === 'todo') {
                    document.getElementById('todo-hidden-image-data').value = '';
                    const container = document.getElementById('todo-image-upload-area');
                    container.innerHTML = `<div class="w-full h-full bg-gray-50 flex flex-col items-center justify-center text-gray-400 group-hover:bg-gray-100 transition cursor-pointer rounded-lg border-2 border-dashed border-gray-200" onclick="document.getElementById('todo-file-upload').click()"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg><span class="text-xs font-bold">上傳圖片 (選填)</span></div>`;
                }
            }
        }

        function renderModalContent(card, isNew) {
            const content = document.getElementById('modal-content-area');
            window.handleImageUpload = function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            const MAX_WIDTH = 600; 
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                            document.getElementById('hidden-image-data').value = dataUrl;
                            const previewContainer = document.getElementById('image-upload-area');
                            document.getElementById('image-section-container').classList.replace('h-16', 'h-56');
                            previewContainer.innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover block"><div class="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center gap-3 opacity-0 hover:opacity-100 transition-opacity duration-300 z-10 group"><button onclick="document.getElementById('file-upload').click()" class="text-white text-xs font-bold border border-white/50 bg-black/20 hover:bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-lg transition hover:scale-105 flex items-center gap-1">更換</button><button onclick="removeImage('card'); event.stopPropagation();" class="text-white text-xs font-bold border border-red-300/50 bg-red-500/40 hover:bg-red-500/60 backdrop-blur-md px-3 py-1.5 rounded-lg transition hover:scale-105 flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>移除</button></div>`;
                        }
                        img.src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            }

            window.updateFormByType = function(type) {
                if (type === 'city_header') {
                    const existingImage = card.data.image;
                    let imageArea = existingImage ? `<img src="${existingImage}" class="w-full h-full object-cover block"><div class="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center gap-3 opacity-0 hover:opacity-100 transition-opacity duration-300 z-10 group"><button onclick="document.getElementById('file-upload').click()" class="text-white text-xs font-bold border border-white/50 bg-black/20 hover:bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-lg transition hover:scale-105 flex items-center gap-1">更換</button><button onclick="removeImage('card'); event.stopPropagation();" class="text-white text-xs font-bold border border-red-300/50 bg-red-500/40 hover:bg-red-500/60 backdrop-blur-md px-3 py-1.5 rounded-lg transition hover:scale-105 flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>移除</button></div>` : `<div class="w-full h-full bg-gray-50 flex flex-col items-center justify-center text-gray-400 group-hover:bg-gray-100 transition cursor-pointer" onclick="document.getElementById('file-upload').click()"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg><span class="text-xs font-bold">點擊上傳封面</span></div>`;

        window.saveCardEdit = function() {

        window.editExpense = function(id) { const entry = window.accountingData.entries.find(e => e.id === id); if(!entry) return; editingExpenseId = id; document.getElementById('expense-date').value = entry.date; document.getElementById('expense-currency').value = entry.currency; document.getElementById('expense-desc').value = entry.desc; document.getElementById('expense-amount').value = entry.amount; document.getElementById('expense-category').value = entry.category; document.querySelector(`input[name="payer"][value="${entry.payer}"]`).checked = true; document.querySelectorAll(`input[name="participant"]`).forEach(c => { const parts = entry.participants || []; c.checked = parts.includes(c.value) }); document.getElementById('form-title').textContent = '編輯支出'; document.getElementById('submit-btn').textContent = '更新紀錄'; document.getElementById('delete-expense-btn').classList.remove('hidden'); document.getElementById('expense-modal').classList.remove('hidden'); }
        window.deleteCurrentExpense = function() { if (!editingExpenseId) return; if (!confirm('確定要刪除這筆支出嗎？')) return; const index = window.accountingData.entries.findIndex(e => e.id === editingExpenseId); if (index !== -1) { window.accountingData.entries.splice(index, 1); saveAccountingToFirestore(); renderAccountingList(); closeExpenseModal(); } }
        document.getElementById('accounting-form').addEventListener('submit', (e) => { e.preventDefault(); const entry = { id: editingExpenseId || Date.now().toString(), date: document.getElementById('expense-date').value, currency: document.getElementById('expense-currency').value, desc: document.getElementById('expense-desc').value, amount: parseFloat(document.getElementById('expense-amount').value), category: document.getElementById('expense-category').value, payer: document.querySelector('input[name="payer"]:checked').value, participants: Array.from(document.querySelectorAll('input[name="participant"]:checked')).map(c => c.value), timestamp: Date.now() }; if(editingExpenseId) { const idx = window.accountingData.entries.findIndex(x => x.id === editingExpenseId); if(idx !== -1) window.accountingData.entries[idx] = entry; } else { window.accountingData.entries.push(entry); } saveAccountingToFirestore(); renderAccountingList(); closeExpenseModal(); });
        function renderAccountingList() { const container = document.getElementById('expense-list'); let entries = window.accountingData.entries.sort((a,b) => b.date.localeCompare(a.date)); if (filterStartDate && filterEndDate) { entries = entries.filter(e => e.date >= filterStartDate && e.date <= filterEndDate); } if(entries.length === 0) { container.innerHTML = '<div class="text-center text-gray-400 py-10">沒有相關紀錄</div>'; return; } container.innerHTML = entries.map(e => ` <div onclick="editExpense('${e.id}')" class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-transparent hover:border-morandi-primary cursor-pointer transition"> <div class="flex items-center space-x-4"> <div class="w-10 h-10 rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md ${e.payer==='Felix'?'bg-morandi-indigo':'bg-morandi-accent'}">${e.payer[0]}</div> <div> <div class="font-bold text-morandi-dark text-base">${e.desc}</div> <div class="text-xs text-gray-400 mt-0.5">${e.date} • ${e.category}</div> </div> </div> <div class="text-right"> <div class="font-bold text-morandi-dark text-lg">${e.currency} ${e.amount}</div> <div class="text-[10px] text-gray-400">for ${e.participants.join(', ')}</div> </div> </div> `).join(''); }
        
        function switchTodoSubTab(tabName) { 
            currentTodoTab = tabName; const todoBtn = document.getElementById('subtab-todo-list'), shoppingBtn = document.getElementById('subtab-shopping-list'), mustEatBtn = document.getElementById('subtab-must-eat-list');
            const iconTodo = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 00-2-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>`, iconShopping = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>`, iconCutlery = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`;
            todoBtn.className = 'tab-btn pb-2 flex items-center gap-2 text-gray-400 border-transparent'; todoBtn.innerHTML = '待辦事項'; shoppingBtn.className = 'tab-btn pb-2 flex items-center gap-2 text-gray-400 border-transparent'; shoppingBtn.innerHTML = '購物清單'; mustEatBtn.className = 'tab-btn pb-2 flex items-center gap-2 text-gray-400 border-transparent'; mustEatBtn.innerHTML = '想吃清單';
            const activeClass = 'tab-btn active-subtab pb-2 flex items-center gap-2';
            if (tabName === 'todo') { todoBtn.className = activeClass; todoBtn.innerHTML = `${iconTodo} 待辦事項`; } else if (tabName === 'shopping') { shoppingBtn.className = activeClass; shoppingBtn.innerHTML = `${iconShopping} 購物清單`; } else if (tabName === 'must_eat') { mustEatBtn.className = activeClass; mustEatBtn.innerHTML = `${iconCutlery} 想吃清單`; }
            renderTodoList(); 
        }

        window.toggleTodoCategory = function(value) { const container = document.getElementById('todo-category-container'); if (value === 'must_eat') container.classList.remove('hidden'); else container.classList.add('hidden'); }
        window.openAddTodoModal = function() { 
            editingTodoId = null; document.getElementById('todo-form').reset(); document.getElementById('todo-hidden-image-data').value = ''; 
            document.getElementById('todo-image-upload-area').innerHTML = `<div class="w-full h-full bg-gray-50 flex flex-col items-center justify-center text-gray-400 group-hover:bg-gray-100 transition cursor-pointer rounded-lg border-2 border-dashed border-gray-200" onclick="document.getElementById('todo-file-upload').click()"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg><span class="text-xs font-bold">上傳圖片 (選填)</span></div>`; 
            document.getElementById('todo-form-title').textContent = '新增項目'; document.getElementById('submit-todo-btn').textContent = '新增項目'; document.getElementById('delete-todo-btn').classList.add('hidden'); document.getElementById('join-itinerary-btn').classList.add('hidden'); document.getElementById('todo-item-modal').classList.remove('hidden'); 
            const typeSelect = document.getElementById('todo-type'); if (typeSelect) typeSelect.value = currentTodoTab; toggleTodoCategory(currentTodoTab);
        }
        window.closeTodoModal = function() { document.getElementById('todo-item-modal').classList.add('hidden'); }
        document.getElementById('todo-form').addEventListener('submit', (e) => { 
            e.preventDefault(); const type = document.getElementById('todo-type').value; let noteText = document.getElementById('todo-note').value, category = '', mustEatVal = '', locationVal = '';
            if(type === 'must_eat') { category = document.getElementById('todo-category').value; mustEatVal = document.getElementById('todo-must-eat').value; locationVal = document.getElementById('todo-location').value; }
            const newItem = { id: editingTodoId || Date.now().toString(), name: document.getElementById('todo-name').value, type, category, note: noteText, must_eat: mustEatVal, location: locationVal, image: document.getElementById('todo-hidden-image-data').value, done: false, timestamp: Date.now() }; 
            if (editingTodoId) { const idx = window.todoData.items.findIndex(x => x.id === editingTodoId); if (idx !== -1) { newItem.done = window.todoData.items[idx].done; window.todoData.items[idx] = newItem; } } else { window.todoData.items.push(newItem); }
            saveTodoToFirestore(); renderTodoList(); closeTodoModal(); 
        });

        window.editTodo = function(id) { 
            const item = window.todoData.items.find(x => x.id === id); if (!item) return; 
            editingTodoId = id; document.getElementById('todo-name').value = item.name; document.getElementById('todo-type').value = item.type; toggleTodoCategory(item.type);
            const joinBtn = document.getElementById('join-itinerary-btn');
            if(item.type === 'must_eat') { joinBtn.classList.remove('hidden'); document.getElementById('todo-must-eat').value = item.must_eat || ''; document.getElementById('todo-location').value = item.location || ''; document.getElementById('todo-category').value = item.category || 'DINING'; document.getElementById('todo-note').value = item.note || ''; }
            else { joinBtn.classList.add('hidden'); document.getElementById('todo-note').value = item.note || ''; }
            document.getElementById('todo-hidden-image-data').value = item.image || ''; 
            const previewContainer = document.getElementById('todo-image-upload-area'); 
            if(item.image) previewContainer.innerHTML = `<img src="${item.image}" class="w-full h-full object-contain block rounded-lg bg-gray-50"><div class="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center gap-3 opacity-0 hover:opacity-100 transition-opacity duration-300 z-10 group"><button onclick="document.getElementById('todo-file-upload').click()" class="text-white text-xs font-bold border border-white/50 bg-black/20 hover:bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-lg transition hover:scale-105 flex items-center gap-1">更換</button><button onclick="removeImage('todo'); event.stopPropagation();" class="text-white text-xs font-bold border border-red-300/50 bg-red-500/40 hover:bg-red-500/60 backdrop-blur-md px-3 py-1.5 rounded-lg transition hover:scale-105 flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>移除</button></div>`; 
            else previewContainer.innerHTML = `<div class="w-full h-full bg-gray-50 flex flex-col items-center justify-center text-gray-400 group-hover:bg-gray-100 transition cursor-pointer rounded-lg border-2 border-dashed border-gray-200" onclick="document.getElementById('todo-file-upload').click()"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg><span class="text-xs font-bold">上傳圖片 (選填)</span></div>`; 
            document.getElementById('todo-form-title').textContent = '編輯項目'; document.getElementById('submit-todo-btn').textContent = '更新項目'; document.getElementById('delete-todo-btn').classList.remove('hidden'); document.getElementById('todo-item-modal').classList.remove('hidden'); 
        }
        
        window.openSyncFromEdit = function() { if(!editingTodoId) return; document.getElementById('todo-item-modal').classList.add('hidden'); prepareSyncModal(editingTodoId); }
        window.deleteCurrentTodo = function() { if (!editingTodoId) return; if (!confirm('確定要刪除此項目嗎？')) return; const index = window.todoData.items.findIndex(x => x.id === editingTodoId); if (index !== -1) { window.todoData.items.splice(index, 1); saveTodoToFirestore(); renderTodoList(); closeTodoModal(); } }
        window.toggleTodoStatus = function(id) { const item = window.todoData.items.find(x => x.id === id); if (!item) return; if (item.type === 'must_eat' && !item.done) prepareSyncModal(id); else { item.done = !item.done; saveTodoToFirestore(); renderTodoList(); } }
        
        function prepareSyncModal(id) {
            const item = window.todoData.items.find(x => x.id === id); if(!item) return;
            pendingTodoId = id; document.getElementById('sync-name').value = item.name; document.getElementById('sync-must-eat').value = item.must_eat || ''; document.getElementById('sync-todo-note').value = item.note || ''; document.getElementById('sync-todo-image').value = item.image || '';
            const cat = (item.category || '').toLowerCase(); document.getElementById('sync-type').value = (cat === 'dining' || cat === 'cafe') ? cat : 'dining';
            document.getElementById('step-1-confirm').classList.remove('hidden'); document.getElementById('step-2-form').classList.add('hidden'); document.getElementById('add-to-itinerary-modal').classList.remove('hidden');
        }
        
        window.confirmAddToItinerary = function(choice) {
            if (choice === 'cancel') { document.getElementById('add-to-itinerary-modal').classList.add('hidden'); renderTodoList(); return; }
            if (choice === false) { const item = window.todoData.items.find(x => x.id === pendingTodoId); if(item) { item.done = true; saveTodoToFirestore(); renderTodoList(); } document.getElementById('add-to-itinerary-modal').classList.add('hidden'); }
            else { document.getElementById('step-1-confirm').classList.add('hidden'); document.getElementById('step-2-form').classList.remove('hidden'); }
        }
        
        window.submitAddToItinerary = function() {
            const dateStr = document.getElementById('sync-date').value, timeStr = document.getElementById('sync-time').value;
            if (!dateStr || !timeStr) { alert('請選擇日期與時間以加入行程表'); return; }
            const dayIndex = window.appData.days.findIndex(d => d.date === dateStr.replace(/-/g, '/'));
            if (dayIndex === -1) { alert('找不到對應日期的行程表，請確認日期是否在旅程範圍內 (2025/12/21 - 2026/01/04)'); return; }
            const newCard = { type: document.getElementById('sync-type').value, name: document.getElementById('sync-name').value, time: timeStr, data: { must_eat: document.getElementById('sync-must-eat').value, note: document.getElementById('sync-todo-note').value, image: document.getElementById('sync-todo-image').value, reservation: '需提前訂位', link: '' } };
            window.appData.days[dayIndex].cards.push(newCard); window.appData.days[dayIndex].cards.sort((a,b) => a.time.localeCompare(b.time));
            const item = window.todoData.items.find(x => x.id === pendingTodoId); if(item) item.done = true;
            saveDataToFirestore(); saveTodoToFirestore(); renderTodoList(); renderDayItinerary(currentDayIndex); document.getElementById('add-to-itinerary-modal').classList.add('hidden'); alert('已成功加入行程！');
        }
        
        function renderTodoList() { 
            const container = document.getElementById('todo-list-container'); container.className = (currentTodoTab === 'shopping') ? 'grid grid-cols-2 gap-3 pb-24' : 'space-y-3 pb-24';
            const filterStatus = document.getElementById('todo-filter').value; let items = window.todoData.items.filter(item => item.type === currentTodoTab); 
            if (filterStatus === 'incomplete') items = items.filter(item => !item.done); else if (filterStatus === 'completed') items = items.filter(item => item.done); 
            items.sort((a, b) => { if (a.done === b.done) return b.timestamp - a.timestamp; return a.done ? 1 : -1; }); 
            if (items.length === 0) { container.innerHTML = '<div class="col-span-2 text-center text-gray-400 py-10">目前沒有項目 🎉</div>'; return; } 
            container.innerHTML = items.map(item => {
                if (item.type === 'shopping') return `<div class="relative bg-white rounded-2xl shadow-sm border border-transparent hover:border-morandi-primary transition group overflow-hidden flex flex-col cursor-pointer" onclick="editTodo('${item.id}')"><div onclick="toggleTodoStatus('${item.id}'); event.stopPropagation();" class="absolute top-2 right-2 z-20 cursor-pointer p-1 bg-white/90 rounded-full backdrop-blur-sm shadow-sm hover:scale-110 transition">${item.done ? `<div class="w-5 h-5 rounded-full bg-morandi-green text-white flex items-center justify-center shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg></div>` : `<div class="w-5 h-5 rounded-full border-2 border-gray-300 group-hover:border-morandi-primary bg-white"></div>`}</div><div class="p-2 pb-0"><div class="aspect-square w-full bg-gray-50 rounded-xl overflow-hidden relative border border-gray-100">${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-gray-300"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg></div>`}</div></div><div class="px-3 py-3 flex-1 flex flex-col"><div class="font-bold text-morandi-dark text-sm leading-tight line-clamp-2 ${item.done ? 'line-through text-gray-400' : ''}">${item.name}</div>${item.note ? `<div class="text-[10px] text-gray-400 mt-1 line-clamp-1">${item.note}</div>` : ''}</div></div>`;
                let badge = ''; if(item.type === 'must_eat') badge = (item.category === 'CAFE' || (item.note && item.note.startsWith('[CAFE]'))) ? `<span class="bg-morandi-orange/10 text-morandi-orange border border-morandi-orange px-2 py-1 rounded-md text-[10px] font-bold tracking-wider uppercase whitespace-nowrap ml-2">CAFE</span>` : `<span class="bg-morandi-blue/10 text-morandi-blue border border-morandi-blue px-2 py-1 rounded-md text-[10px] font-bold tracking-wider uppercase whitespace-nowrap ml-2">DINING</span>`;
                let displayNote = item.note || ''; if (displayNote.startsWith('[CAFE] ')) displayNote = displayNote.replace('[CAFE] ', ''); else if (displayNote.startsWith('[DINING] ')) displayNote = displayNote.replace('[DINING] ', '');
                let displayName = (item.type === 'must_eat' && item.location) ? `<span class="text-black font-black mr-1">${item.location}</span> <span class="text-gray-300 mx-1">|</span> ${item.name}` : item.name;
                return `<div class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-transparent hover:border-morandi-primary transition group"><div class="flex items-center flex-1 overflow-hidden"><div onclick="toggleTodoStatus('${item.id}')" class="cursor-pointer mr-4 flex-shrink-0">${item.done ? `<div class="w-6 h-6 rounded-full bg-morandi-green text-white flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg></div>` : `<div class="w-6 h-6 rounded-full border-2 border-gray-300 group-hover:border-morandi-primary"></div>`}</div><div onclick="editTodo('${item.id}')" class="cursor-pointer flex-1 min-w-0"><div class="font-bold text-morandi-dark text-base truncate ${item.done ? 'line-through text-gray-400' : ''}">${displayName}</div>${item.must_eat ? `<div class="text-xs text-morandi-orange font-bold mt-1 truncate">必吃：${item.must_eat}</div>` : ''}${(item.type !== 'must_eat' && item.location) ? `<div class="text-xs text-morandi-blue font-bold mt-0.5 truncate">📍 ${item.location}</div>` : ''}${displayNote ? `<div class="text-xs text-gray-400 mt-0.5 truncate">${displayNote}</div>` : ''}</div></div>${badge}</div>`;
            }).join(''); 
        }
        
        window.handleTodoImageUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader(); reader.onload = function(e) {
                    const img = new Image(); img.onload = function() {
                        const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d'), MAX_WIDTH = 600, scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize; ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6); document.getElementById('todo-hidden-image-data').value = dataUrl;
                        document.getElementById('todo-image-upload-area').innerHTML = `<img src="${dataUrl}" class="w-full h-full object-contain block rounded-lg bg-gray-50"><div class="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center gap-3 opacity-0 hover:opacity-100 transition-opacity duration-300 group"><button onclick="document.getElementById('todo-file-upload').click()" class="text-white text-xs font-bold border border-white bg-white/20 hover:bg-white/30 backdrop-blur-md px-3 py-1.5 rounded-lg transition hover:scale-105">更換</button><button onclick="removeImage('todo'); event.stopPropagation();" class="text-white text-xs font-bold border border-red-300 bg-red-500/40 hover:bg-red-500/70 backdrop-blur-md px-3 py-1.5 rounded-lg transition flex items-center gap-1 hover:scale-105"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>移除</button></div>`;
                    }; img.src = e.target.result;
                }; reader.readAsDataURL(file);
            }
        }

        function switchTab(id) { document.getElementById('itinerary-view').classList.add('hidden'); document.getElementById('budget-view').classList.add('hidden'); document.getElementById('todo-view').classList.add('hidden'); document.getElementById(id+'-view').classList.remove('hidden'); document.querySelectorAll('#nav-menu button').forEach(btn => { btn.classList.remove('menu-active'); btn.classList.add('border-transparent'); }); const activeBtn = document.getElementById('menu-'+id); if(activeBtn) { activeBtn.classList.add('menu-active'); activeBtn.classList.remove('border-transparent'); } const menu = document.getElementById('nav-menu'); if(menu.classList.contains('menu-visible')) toggleMenu(); if(id === 'budget') switchBudgetSubTab('history'); if(id === 'todo') switchTodoSubTab('todo'); }
        function renderAll() { document.getElementById('loading-indicator').classList.add('hidden'); renderDayNavigation(); renderDayItinerary(currentDayIndex); }
        document.getElementById('expense-date').valueAsDate = new Date(); document.addEventListener('DOMContentLoaded', () => { switchTab('itinerary'); });
    </script>
